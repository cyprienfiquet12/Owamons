<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokéchat – Infos & Commandes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget" id="widget">
        <div class="widget-inner">
            <img src="logo-removebg-preview.png" alt="Pokéchat" class="widget-logo">
            <div class="slides-wrap">
                <div class="slides" id="slides">
                    <div class="slide active" data-slide="0">
                        <p class="slide-text">Choisis ton starter&nbsp;! <code>!starter</code></p>
                    </div>
                    <div class="slide" data-slide="1">
                        <p class="slide-text">Achète tes premières Pokéballs&nbsp;: <code>!shop 1 pokéball</code></p>
                    </div>
                    <div class="slide" data-slide="2">
                        <p class="slide-text">Participe aux <code>!combat</code> ou <code>!capture</code> pour t’inscrire au classement</p>
                    </div>
                    <div class="slide" data-slide="3">
                        <p class="slide-text">Plus d’infos&nbsp;: <code>!pokéchat</code></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
